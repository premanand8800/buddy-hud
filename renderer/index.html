<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="stage">
  <div id="bubbles">
    <div id="perms"></div>
    <div id="onboard" class="bubble" hidden></div>
    <div id="drawer" class="bubble" data-tab="details" hidden>
      <div id="dhead">
        <div class="segs">
          <button data-tab="chat" class="seg" title="Chat">💬<span class="l"> Chat</span></button>
          <button data-tab="details" class="seg on" title="Details">📋<span class="l"> Details</span></button>
          <button data-tab="settings" class="seg" title="Settings">⚙️<span class="l"> Settings</span></button>
          <button data-tab="custom" class="seg" title="Customize">🎨<span class="l"> Customize</span></button>
        </div>
        <span class="grow"></span>
        <button id="btnClose" title="Close (Esc)">✕</button>
      </div>

      <section data-t="chat" class="chatsec">
        <div id="chathead"></div>
        <div id="chatlog"></div>
      </section>

      <section data-t="details">
        <div id="health"></div>
        <div id="tabs"></div>
        <div class="stats" id="chips"></div>
        <div id="lastmsg"></div>
        <div id="usage"></div>
        <div id="files"></div>
        <div class="feedHead">Activity</div>
        <div id="feed"></div>
      </section>

      <section data-t="settings" class="panel">
        <div class="grp">Notifications &amp; sound</div>
        <label><input type="checkbox" id="alNotify"> 🔔 Desktop notifications</label>
        <label><input type="checkbox" id="alSound"> 🔊 Sound</label>
        <label><input type="checkbox" id="alDone"> ✅ When Claude finishes</label>
        <label><input type="checkbox" id="alAsk"> 🙋 When Claude needs me</label>
        <label><input type="checkbox" id="alStuck"> ⏳ Seems stuck / context nearly full</label>
        <label><input type="checkbox" id="alDnd"> 🌙 Do not disturb (silences everything above)</label>
        <div class="grp">Replies</div>
        <label title="Experimental: the terminal shows 'hook running' while waiting"><input type="checkbox" id="optReply"> 📡 Hold turn-end so I can reply from here</label>
        <div class="grp">Privacy</div>
        <label><input type="checkbox" id="optPrivacy"> 🙈 Blur paths, code and messages (screen sharing)</label>
        <div class="grp">Phone</div>
        <label title="Approve permissions and reply from your phone on the same Wi-Fi"><input type="checkbox" id="optPhone"> 📱 Phone access (same Wi-Fi)</label>
        <div id="phoneBox" hidden></div>
        <div class="grp">Context window</div>
        <div class="note" id="ctxNote">Detected automatically from the model Claude is using.</div>
        <div class="grp">App</div>
        <div class="rowbtns">
          <button id="btnHide">Hide</button>
          <button id="btnQuit">⏻ Quit</button>
          <span class="ver" id="ver"></span>
        </div>
      </section>

      <section data-t="custom" class="panel">
        <div class="grp">Look</div>
        <label>Character
          <select id="optSkin"><option value="bot">Bot</option><option value="cat">Cat</option><option value="classic">Classic (logo homage)</option><option value="3d">3D (beta)</option></select>
        </label>
        <label>Size
          <select id="optScale"><option value="0.85">Small</option><option value="1">Normal</option><option value="1.25">Large</option></select>
        </label>
        <div class="grp">Behaviour</div>
        <label><input type="checkbox" id="optAlways"> 👀 Always show, even when Claude is closed</label>
        <label><input type="checkbox" id="optWalk"> 🚶 Walk around when idle</label>
        <div class="note">The buddy's colour follows the model Claude is using.</div>
      </section>
    </div>
    <div id="action" class="bubble" hidden></div>
    <div id="reply" class="bubble" hidden>
      <div class="hint" id="replyHint"></div>
      <div class="inputRow">
        <textarea id="replyInput" rows="1" placeholder="Tell Claude…"></textarea>
        <button id="btnSend" title="send">➤</button>
        <button id="btnSkip" title="answer in terminal instead">⏭</button>
      </div>
    </div>
  </div>

  <div id="strip" hidden></div>
  <div id="dock">
    <div id="dockBtns"><button id="btnChat" title="Chat with Claude">💬</button><button id="btnSet" title="Settings">⚙️</button><button id="btnCust" title="Customize">🎨</button></div>
    <button id="pill" title="details">
      <svg class="arc" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="track"/><circle cx="18" cy="18" r="15" class="fill" id="arc" pathLength="100"/></svg>
      <i id="hdot"></i><span class="pt"><b id="pillPct">0%</b><small id="pillSub">idle</small></span>
    </button>

    <div id="mascot" title="Click for details">
      <div class="shadow"></div>
      <div id="modelTag"><i></i><span>—</span></div>
      <svg id="clawd" viewBox="-40 -56 240 224" data-act="idle" data-eyes="sleep" data-look="">
        <g class="fx" id="fx">
          <rect x="-34" y="30" width="16" height="4"/><rect x="-40" y="52" width="22" height="4"/><rect x="-34" y="74" width="16" height="4"/>
          <rect x="178" y="30" width="16" height="4"/><rect x="178" y="52" width="22" height="4"/><rect x="178" y="74" width="16" height="4"/>
        </g>
        <g class="rig">
          <g class="body">
            <g class="leg" id="legA"><rect x="0" y="114" width="16" height="44"/><rect x="36" y="114" width="16" height="44"/></g>
            <g class="leg" id="legB"><rect x="107" y="114" width="16" height="44"/><rect x="144" y="114" width="16" height="44"/></g>
            <g class="deco" id="antenna"><rect x="76" y="-26" width="8" height="26"/><circle cx="80" cy="-32" r="10"/></g>
            <g class="deco" id="ears"><polygon points="8,0 8,-38 46,0"/><polygon points="152,0 152,-38 114,0"/></g>
            <rect class="torso" x="0" y="0" width="160" height="114"/>
            <g class="hand" id="handL"><rect x="-18" y="38" width="18" height="38"/></g>
            <g class="hand" id="handR"><rect x="160" y="38" width="18" height="38"/></g>
            <g class="eyes" id="eyes">
              <g class="e-squint"><path d="M17 37 L41 51 L17 65"/><path d="M143 37 L119 51 L143 65"/></g>
              <g class="e-open"><g class="blinker"><rect x="21" y="36" width="16" height="28" rx="8"/><circle class="shine" cx="32" cy="44" r="3.4"/></g><g class="blinker"><rect x="123" y="36" width="16" height="28" rx="8"/><circle class="shine" cx="134" cy="44" r="3.4"/></g></g>
              <g class="e-happy"><path d="M17 62 L29 42 L41 62"/><path d="M119 62 L131 42 L143 62"/></g>
              <g class="e-sleep"><path d="M17 54 H41"/><path d="M119 54 H143"/></g>
              <g class="e-wide"><g class="blinker"><rect x="19" y="30" width="20" height="36" rx="10"/><circle class="shine" cx="33" cy="41" r="4.6"/><circle class="shine" cx="27" cy="57" r="2"/></g><g class="blinker"><rect x="121" y="30" width="20" height="36" rx="10"/><circle class="shine" cx="135" cy="41" r="4.6"/><circle class="shine" cx="129" cy="57" r="2"/></g></g>
            </g>
          </g>
        </g>
        <text id="item" x="80" y="-20" text-anchor="middle"></text>
        <text id="item2" x="188" y="10" text-anchor="middle"></text>
      </svg>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
